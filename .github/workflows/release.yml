# The release: unsigned builds for every platform (macOS universal .dmg, Windows x64/x86/arm64
# .msi + portable zip, Linux x86_64/aarch64 AppImage/deb/rpm/tar.gz/Flatpak, Linux riscv64,
# FreeBSD and the web), published as the GitHub Release `v<version>`. Runs on a push to the
# `release` branch, or by hand with an optional version override. The version comes from
# Cargo.toml; the jobs are release-wip.yml's (free GitHub-hosted runners, no signing secrets).
#
# Unsigned on purpose: Windows SmartScreen asks before the first run, and macOS needs a
# right-click › Open the first time (the release notes say how). Browser sign-in
# (MAILCRAFT_MICROSOFT_CLIENT_ID, MAILCRAFT_GOOGLE_CLIENT_ID/_SECRET) is built in when the
# repository has those secrets (docs/oauth.md).
name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override, e.g. 0.2.0-rc.1 (empty: Cargo.toml)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/release-wip.yml
    with:
      version: ${{ inputs.version || '' }}
    secrets: inherit
